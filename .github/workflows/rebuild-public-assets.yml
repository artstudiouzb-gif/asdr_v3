name: Temporary rebuild public assets

on:
  push:
    branches:
      - fix/public-i18n-hardcodes

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - name: Commit generated assets and remove temporary workflow
        run: |
          rm .github/workflows/rebuild-public-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets .github/workflows/rebuild-public-assets.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Пересобрать публичные assets"
          git push
